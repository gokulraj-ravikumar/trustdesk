spring:
  application:
    name: trustdesk
  datasource:
    url: jdbc:postgresql://localhost:5432/trustdesk
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

ai:
  gemini:
    api-key: ${GEMINI_API_KEY:dummy-test-key}

app:
  security:
    api-token: "demo-secret-token-123"
    admin-username: "agent"
    admin-password: "trustdesk123"
    # In production, these would be injected via environment variables:
    # admin-password: ${ADMIN_PASSWORD}