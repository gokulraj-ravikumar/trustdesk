spring:
  application:
    name: trustdesk
  datasource:
    url: jdbc:postgresql://localhost:5432/trustdesk
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

ai:
  gemini:
    api-key: ${GEMINI_API_KEY:dummy-test-key}